<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<meta name="description" content="Genera cuentas T a partir de pólizas contables — captura manual o desde Excel/CSV." />
<link rel="manifest" href="./manifest.json" />

<link rel="icon" href="./icons/icon-192.png" />

<style>

  html, body { margin: 0; padding: 0; }

  body {
    --paper: #EAF1E8;
    --card: #F9FBF6;
    --ink: #1F2D3D;
    --rule: #cfe0cb;
    --rule-strong: #8FB587;
    --gold: #A9791F;

    --forest: #2F6D4F;

    border-bottom: 3px double var(--rule-strong);
    padding-bottom: 14px;

  .ct-title { display: flex; align-items: center; gap: 12px; }
  .ct-badge {

  .ct-title-text { display: flex; flex-direction: column; }

  .eyebrow {

  .ct-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn.add { background: var(--ink); color: var(--paper); }

  .ct-form-top { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }

  .ct-balanza {

  .ct-balanza th {

    font-weight: 700; padding-top: 8px; padding-bottom: 8px;

  .tcard { background: var(--card); border: 1.5px solid var(--ink); border-radius: 2px; box-shadow: 3px 3px 0 rgba(31,45,61,0.08); }
  .tcard-header { text-align: center; font-weight: 700; font-size: 15px; padding: 10px 8px 8px; border-bottom: 2px solid var(--ink); }
  .tcard-subhead {
    display: grid; grid-template-columns: 1fr 1fr;
    font-family: 'Courier New', monospace; font-size: 10.5px; letter-spacing: 1.5px;

  .tcard-subhead > div { padding: 4px 10px; text-align: center; }
  .tcard-subhead > div:first-child { border-right: 1.5px solid var(--ink); }
  .tcard-body { display: grid; grid-template-columns: 1fr 1fr; min-height: 36px; }
  .tcol { padding: 6px 10px; }

  .trow { font-family: 'Courier New', monospace; font-size: 13px; text-align: right; padding: 2px 0; border-bottom: 1px dotted var(--rule-strong); cursor: help; }
  .tcol-debe .trow { text-align: left; }
  .tcard-totals { display: grid; grid-template-columns: 1fr 1fr; font-family: 'Courier New', monospace; font-weight: 700; font-size: 13px; }
  .tcard-totals .ttotal { padding: 6px 10px; border-top: 2px solid var(--ink); border-bottom: 4px double var(--ink); text-align: right; }
  .tcard-totals .ttotal:first-child { border-right: 1.5px solid var(--ink); text-align: left; }
  .tcard-saldo { padding: 8px 10px 10px; font-family: 'Courier New', monospace; font-size: 12.5px; text-align: center; color: #445; }
  .saldo-cero { color: var(--forest); font-weight: bold; }

  .ct-toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: var(--paper); border: 1.5px solid var(--gold);

<script>
// ---------- Datos y utilidades ----------

const STORAGE_KEY = 'cuentasT_movimientos_v1';
const TIPOS_STORAGE_KEY = 'cuentasT_tipoCuentas_v1';

// Catálogo de cuentas comunes (nombre normalizado -> tipo). Se usa para
// clasificar automáticamente cuentas conocidas; lo que no aparezca aquí
// se le pregunta al usuario una sola vez.
const CATALOGO_CUENTAS = {
  'caja': 'Activo',
  'bancos': 'Activo',
  'clientes': 'Activo',
  'documentos por cobrar': 'Activo',
  'deudores diversos': 'Activo',
  'almacén': 'Activo',
  'mercancías': 'Activo',
  'iva acreditable': 'Activo',
  'mobiliario y equipo': 'Activo',
  'equipo de cómputo': 'Activo',
  'equipo de transporte': 'Activo',
  'terrenos': 'Activo',
  'edificios': 'Activo',
  'rentas pagadas por anticipado': 'Activo',

  'proveedores': 'Pasivo',
  'acreedores diversos': 'Pasivo',
  'documentos por pagar': 'Pasivo',
  'iva por pagar': 'Pasivo',
  'iva trasladado': 'Pasivo',
  'isr por pagar': 'Pasivo',
  'imss por pagar': 'Pasivo',
  'impuestos por pagar': 'Pasivo',
  'sueldos por pagar': 'Pasivo',
  'ptu por pagar': 'Pasivo',
  'acreedores hipotecarios': 'Pasivo',

  'capital social': 'Capital',
  'utilidades acumuladas': 'Capital',
  'pérdidas acumuladas': 'Capital',
  'reserva legal': 'Capital',

  'ventas': 'Ingresos',
  'ingresos por servicios': 'Ingresos',
  'productos financieros': 'Ingresos',
  'otros ingresos': 'Ingresos',

  'sueldos y salarios': 'Gastos',
  'renta': 'Gastos',
  'papelería y útiles': 'Gastos',
  'costo de ventas': 'Gastos',
  'gastos de venta': 'Gastos',
  'gastos de administración': 'Gastos',
  'gastos financieros': 'Gastos',
  'depreciación': 'Gastos',
  'publicidad': 'Gastos',
  'luz': 'Gastos',
  'teléfono': 'Gastos',
  'mantenimiento': 'Gastos',
  'combustibles y lubricantes': 'Gastos',
  'honorarios': 'Gastos',
};

function getTipoCuenta(cuenta) {
  if (state.tipoCuentas[cuenta]) return state.tipoCuentas[cuenta];
  const norm = normalizeHeader(cuenta);
  return CATALOGO_CUENTAS[norm] || null;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function money(n) {
  return (n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function normalizeHeader(h) {
  return String(h || '').trim().toLowerCase();
}

function findKey(row, candidates) {
  const keys = Object.keys(row);
  for (const c of candidates) {
    const found = keys.find((k) => normalizeHeader(k) === c);
    if (found) return found;
  }
  return null;
}

function parseRows(rows) {
  if (!rows || !rows.length) return { movimientos: [], error: 'El archivo está vacío.' };
  const sample = rows[0];
  const cuentaKey = findKey(sample, ['cuenta', 'cuenta contable', 'nombre de cuenta']);
  const conceptoKey = findKey(sample, ['concepto', 'descripcion', 'descripción']);
  const debeKey = findKey(sample, ['debe', 'cargo', 'cargos']);
  const haberKey = findKey(sample, ['haber', 'abono', 'abonos', 'credito', 'crédito']);
  const fechaKey = findKey(sample, ['fecha']);

  if (!cuentaKey || (!debeKey && !haberKey)) {
    return { movimientos: [], error: 'No encontré columnas de "Cuenta" y "Debe"/"Haber". Revisa los encabezados del archivo.' };
  }

  const movimientos = [];
  rows.forEach((row) => {
    const cuenta = String(row[cuentaKey] || '').trim();
    if (!cuenta) return;
    const debe = parseFloat(row[debeKey]) || 0;
    const haber = parseFloat(row[haberKey]) || 0;
    if (!debe && !haber) return;
    const concepto = conceptoKey ? String(row[conceptoKey] || '') : '';
    const fecha = fechaKey ? String(row[fechaKey] || '') : '';
    movimientos.push({ cuenta, concepto, fecha, debe, haber });
  });

  return { movimientos, error: null };
}

function groupByCuenta(movimientos) {
  const accounts = {};
  movimientos.forEach((m) => {
    if (!accounts[m.cuenta]) accounts[m.cuenta] = { debitos: [], creditos: [] };
    if (m.debe) accounts[m.cuenta].debitos.push({ monto: m.debe, concepto: m.concepto, fecha: m.fecha });
    if (m.haber) accounts[m.cuenta].creditos.push({ monto: m.haber, concepto: m.concepto, fecha: m.fecha });
  });
  return accounts;
}

function buildCuentasTSheet(accounts) {
  const aoa = [];
  const merges = [];
  Object.entries(accounts).forEach(([nombre, mov]) => {
    merges.push({ s: { r: aoa.length, c: 0 }, e: { r: aoa.length, c: 1 } });
    aoa.push([nombre, '']);
    aoa.push(['DEBE', 'HABER']);

    const totalDebe = mov.debitos.reduce((s, d) => s + d.monto, 0);
    const totalHaber = mov.creditos.reduce((s, c) => s + c.monto, 0);
    const filas = Math.max(mov.debitos.length, mov.creditos.length);
    for (let i = 0; i < filas; i++) {
      aoa.push([mov.debitos[i] ? mov.debitos[i].monto : '', mov.creditos[i] ? mov.creditos[i].monto : '']);
    }
    aoa.push([totalDebe, totalHaber]);

    const saldo = totalDebe - totalHaber;
    const saldoTexto = saldo === 0 ? 'Saldado' : saldo > 0 ? `Saldo deudor: ${money(saldo)}` : `Saldo acreedor: ${money(-saldo)}`;
    merges.push({ s: { r: aoa.length, c: 0 }, e: { r: aoa.length, c: 1 } });
    aoa.push([saldoTexto, '']);
    aoa.push(['', '']);
  });
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!merges'] = merges;
  ws['!cols'] = [{ wch: 24 }, { wch: 24 }];
  return ws;
}

function buildMovimientosSheet(movimientos) {
  const aoa = [['Fecha', 'Cuenta', 'Concepto', 'Debe', 'Haber']];
  movimientos.forEach((m) => aoa.push([m.fecha, m.cuenta, m.concepto, m.debe || '', m.haber || '']));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 10 }, { wch: 20 }, { wch: 32 }, { wch: 12 }, { wch: 12 }];
  return ws;
}

function buildBalanzaRows(accounts) {
  const rows = Object.entries(accounts).map(([cuenta, mov]) => {
    const totalDebe = mov.debitos.reduce((s, d) => s + d.monto, 0);
    const totalHaber = mov.creditos.reduce((s, c) => s + c.monto, 0);
    const saldo = totalDebe - totalHaber;
    return {
      cuenta,
      totalDebe,
      totalHaber,
      saldoDeudor: saldo > 0 ? saldo : 0,
      saldoAcreedor: saldo < 0 ? -saldo : 0,
    };
  });
  const totals = rows.reduce((acc, r) => ({
    totalDebe: acc.totalDebe + r.totalDebe,
    totalHaber: acc.totalHaber + r.totalHaber,
    saldoDeudor: acc.saldoDeudor + r.saldoDeudor,
    saldoAcreedor: acc.saldoAcreedor + r.saldoAcreedor,
  }), { totalDebe: 0, totalHaber: 0, saldoDeudor: 0, saldoAcreedor: 0 });
  return { rows, totals };
}

function buildBalanzaSheet(accounts) {
  const { rows, totals } = buildBalanzaRows(accounts);
  const aoa = [['Cuenta', 'Debe', 'Haber', 'Saldo deudor', 'Saldo acreedor']];
  rows.forEach((r) => aoa.push([r.cuenta, r.totalDebe, r.totalHaber, r.saldoDeudor || '', r.saldoAcreedor || '']));
  aoa.push(['Sumas', totals.totalDebe, totals.totalHaber, totals.saldoDeudor, totals.saldoAcreedor]);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 24 }, { wch: 14 }, { wch: 14 }, { wch: 16 }, { wch: 16 }];
  return ws;
}

function buildEstadoResultadosSheet(accounts) {
  const ingresos = [];
  const gastos = [];
  Object.entries(accounts).forEach(([cuenta, mov]) => {
    const tipo = getTipoCuenta(cuenta);
    const totalDebe = mov.debitos.reduce((s, d) => s + d.monto, 0);
    const totalHaber = mov.creditos.reduce((s, c) => s + c.monto, 0);
    if (tipo === 'Ingresos') ingresos.push([cuenta, totalHaber - totalDebe]);
    else if (tipo === 'Gastos') gastos.push([cuenta, totalDebe - totalHaber]);
  });
  const totalIngresos = ingresos.reduce((s, [, m]) => s + m, 0);
  const totalGastos = gastos.reduce((s, [, m]) => s + m, 0);
  const utilidad = totalIngresos - totalGastos;

  const aoa = [['Estado de Resultados'], [], ['Ingresos']];
  ingresos.forEach(([c, m]) => aoa.push([c, m]));
  aoa.push(['Total Ingresos', totalIngresos]);
  aoa.push([]);
  aoa.push(['Gastos']);
  gastos.forEach(([c, m]) => aoa.push([c, m]));
  aoa.push(['Total Gastos', totalGastos]);
  aoa.push([]);
  aoa.push([utilidad >= 0 ? 'Utilidad del ejercicio' : 'Pérdida del ejercicio', utilidad]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 30 }, { wch: 16 }];
  return ws;
}

function buildBalanceGeneralSheet(accounts) {
  const activos = [];
  const pasivos = [];
  const capitales = [];
  let totalIngresos = 0;
  let totalGastos = 0;
  Object.entries(accounts).forEach(([cuenta, mov]) => {
    const tipo = getTipoCuenta(cuenta);
    const totalDebe = mov.debitos.reduce((s, d) => s + d.monto, 0);
    const totalHaber = mov.creditos.reduce((s, c) => s + c.monto, 0);
    if (tipo === 'Activo') activos.push([cuenta, totalDebe - totalHaber]);
    else if (tipo === 'Pasivo') pasivos.push([cuenta, totalHaber - totalDebe]);
    else if (tipo === 'Capital') capitales.push([cuenta, totalHaber - totalDebe]);
    else if (tipo === 'Ingresos') totalIngresos += totalHaber - totalDebe;
    else if (tipo === 'Gastos') totalGastos += totalDebe - totalHaber;
  });
  const totalActivo = activos.reduce((s, [, m]) => s + m, 0);
  const totalPasivo = pasivos.reduce((s, [, m]) => s + m, 0);
  const totalCapitalPropio = capitales.reduce((s, [, m]) => s + m, 0);
  const utilidad = totalIngresos - totalGastos;
  const totalCapital = totalCapitalPropio + utilidad;

  const aoa = [['Balance General'], [], ['Activo']];
  activos.forEach(([c, m]) => aoa.push([c, m]));
  aoa.push(['Total Activo', totalActivo]);
  aoa.push([]);
  aoa.push(['Pasivo']);
  pasivos.forEach(([c, m]) => aoa.push([c, m]));
  aoa.push(['Total Pasivo', totalPasivo]);
  aoa.push([]);
  aoa.push(['Capital']);
  capitales.forEach(([c, m]) => aoa.push([c, m]));
  aoa.push([utilidad >= 0 ? 'Utilidad del ejercicio' : 'Pérdida del ejercicio', utilidad]);
  aoa.push(['Total Capital', totalCapital]);
  aoa.push([]);
  aoa.push(['Total Pasivo + Capital', totalPasivo + totalCapital]);

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = [{ wch: 30 }, { wch: 16 }];
  return ws;
}

function loadMovimientos() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveMovimientos(movs) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(movs));
  } catch (e) {
    console.error('No se pudo guardar automáticamente:', e);
  }
}

function loadTipoCuentas() {
  try {
    const raw = localStorage.getItem(TIPOS_STORAGE_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : {};
  } catch (e) {
    return {};
  }
}

function saveTipoCuentas(map) {
  try {
    localStorage.setItem(TIPOS_STORAGE_KEY, JSON.stringify(map));
  } catch (e) {

let toastTimer = null;
function showToast(message) {
  let el = document.getElementById('ct-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'ct-toast';
    el.className = 'ct-toast';
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.classList.remove('show');
  void el.offsetWidth; // fuerza reflow para reiniciar la animación si ya estaba visible
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function processFile(file) {
  state.error = null;
  state.fileName = file.name;
  const isCSV = /\.csv$/i.test(file.name);
  if (isCSV) {
    const reader = new FileReader();
    reader.onload = (e) => {
      Papa.parse(e.target.result, {
        header: true,
        skipEmptyLines: true,
        complete: (res) => {
          const { movimientos: mov, error: err } = parseRows(res.data);
          if (err) { state.error = err; } else { state.movimientos = mov; saveMovimientos(mov); }
          render();
        },
        error: () => { state.error = 'No pude leer el archivo CSV.'; render(); },
      });
    };
    reader.readAsText(file);
  } else {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        const { movimientos: mov, error: err } = parseRows(rows);
        if (err) { state.error = err; } else { state.movimientos = mov; saveMovimientos(mov); }
      } catch (err) {
        state.error = 'No pude leer el archivo. Verifica que sea un Excel válido.';
      }
      render();
    };
    reader.readAsArrayBuffer(file);
  }
}

function loadSample(index) {

function exportExcel() {
  const accounts = groupByCuenta(state.movimientos);
  const cuentasUsadas = [...new Set(state.movimientos.map((m) => m.cuenta))];
  const sinClasificar = cuentasUsadas.filter((c) => !getTipoCuenta(c));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, buildCuentasTSheet(accounts), 'Cuentas T');
  XLSX.utils.book_append_sheet(wb, buildBalanzaSheet(accounts), 'Balanza');
  if (sinClasificar.length === 0) {
    XLSX.utils.book_append_sheet(wb, buildEstadoResultadosSheet(accounts), 'Estado de Resultados');
    XLSX.utils.book_append_sheet(wb, buildBalanceGeneralSheet(accounts), 'Balance General');
  }
  XLSX.utils.book_append_sheet(wb, buildMovimientosSheet(state.movimientos), 'Movimientos');
  XLSX.writeFile(wb, 'cuentas-t.xlsx');
  showToast('✓ Excel descargado');
}

}

function guardarPoliza() {
  const fecha = state.formFecha.trim();
  const concepto = state.formConcepto.trim();
  const lineasValidas = [];
  for (const l of state.formLineas) {
    const cuenta = (l.cuenta || '').trim();
    const debe = parseFloat(l.debe) || 0;
    const haber = parseFloat(l.haber) || 0;
    const vacia = !cuenta && !debe && !haber;
    if (vacia) continue;
    if (!cuenta) { state.formError = 'Falta el nombre de la cuenta en una de las líneas.'; render(); return; }
    if (!debe && !haber) { state.formError = `Falta un monto en Debe o Haber en la línea de "${cuenta}".`; render(); return; }
    lineasValidas.push({ cuenta, concepto, fecha, debe, haber });
  }
  if (lineasValidas.length === 0) { state.formError = 'Agrega al menos una línea con cuenta y monto.'; render(); return; }
  state.formError = null;
  state.movimientos = [...state.movimientos, ...lineasValidas];
  saveMovimientos(state.movimientos);
  state.formConcepto = '';
  state.formLineas = [{ cuenta: '', debe: '', haber: '' }];
  render();
}

function guardarClasificacion() {
  const cuentasUsadas = [...new Set(state.movimientos.map((m) => m.cuenta))];
  const sinClasificar = cuentasUsadas.filter((c) => !getTipoCuenta(c));
  const pending = state.pendingClasificacion || {};

  for (const c of sinClasificar) {
    if (!pending[c]) {
      state.clasificarError = 'Elige un tipo para cada cuenta antes de continuar.';
      render();
      return;
    }
  }

  sinClasificar.forEach((c) => { state.tipoCuentas[c] = pending[c]; });
  state.pendingClasificacion = {};
  state.clasificarError = null;
  saveTipoCuentas(state.tipoCuentas);
  render();
}

function toggleDetalle() {
  state.showDetalle = !state.showDetalle;
  render();
}

function removeMovimiento(index) {
  state.movimientos.splice(index, 1);
  saveMovimientos(state.movimientos);
  render();
}

function updateFormDiff() {
  const el = document.getElementById('form-diff');
  if (!el) return;
  const sumDebeForm = state.formLineas.reduce((s, l) => s + (parseFloat(l.debe) || 0), 0);
  const sumHaberForm = state.formLineas.reduce((s, l) => s + (parseFloat(l.haber) || 0), 0);
  const diffForm = sumDebeForm - sumHaberForm;
  el.classList.toggle('ok', diffForm === 0);
  el.textContent = diffForm === 0
    ? '✓ Esta póliza cuadra'
    : `Diferencia: ${money(Math.abs(diffForm))} (falta en ${diffForm > 0 ? 'Haber' : 'Debe'})`;
}

    const totalDebe = mov.debitos.reduce((s, d) => s + d.monto, 0);
    const totalHaber = mov.creditos.reduce((s, c) => s + c.monto, 0);
    if (tipo === 'Ingresos') ingresos.push({ cuenta, monto: totalHaber - totalDebe });
    else if (tipo === 'Gastos') gastos.push({ cuenta, monto: totalDebe - totalHaber });
  });

  const totalIngresos = ingresos.reduce((s, i) => s + i.monto, 0);
  const totalGastos = gastos.reduce((s, g) => s + g.monto, 0);
  const utilidad = totalIngresos - totalGastos;

  const filaVacia = (texto) => `<div class="ct-estado-row muted"><span>${texto}</span><span></span></div>`;

  return `
    <div class="ct-estado">
      <div class="ct-estado-section">
        <div class="ct-estado-title">Ingresos</div>
        ${ingresos.length ? ingresos.map((i) => `<div class="ct-estado-row"><span>${esc(i.cuenta)}</span><span>${money(i.monto)}</span></div>`).join('') : filaVacia('Sin cuentas de ingresos')}
        <div class="ct-estado-row ct-estado-subtotal"><span>Total Ingresos</span><span>${money(totalIngresos)}</span></div>
      </div>
      <div class="ct-estado-section">
        <div class="ct-estado-title">Gastos</div>
        ${gastos.length ? gastos.map((g) => `<div class="ct-estado-row"><span>${esc(g.cuenta)}</span><span>${money(g.monto)}</span></div>`).join('') : filaVacia('Sin cuentas de gastos')}
        <div class="ct-estado-row ct-estado-subtotal"><span>Total Gastos</span><span>${money(totalGastos)}</span></div>
      </div>
      <div class="ct-estado-row ct-estado-final ${utilidad >= 0 ? 'ok' : 'off'}">
        <span>${utilidad >= 0 ? 'Utilidad del ejercicio' : 'Pérdida del ejercicio'}</span>
        <span>${money(Math.abs(utilidad))}</span>
      </div>
    </div>
  `;
}

function balanceGeneralHtml(accounts) {
  const activos = [];
  const pasivos = [];
  const capitales = [];
  let totalIngresos = 0;
  let totalGastos = 0;

  Object.entries(accounts).forEach(([cuenta, mov]) => {
    const tipo = getTipoCuenta(cuenta);
    const totalDebe = mov.debitos.reduce((s, d) => s + d.monto, 0);
    const totalHaber = mov.creditos.reduce((s, c) => s + c.monto, 0);
    if (tipo === 'Activo') activos.push({ cuenta, monto: totalDebe - totalHaber });
    else if (tipo === 'Pasivo') pasivos.push({ cuenta, monto: totalHaber - totalDebe });
    else if (tipo === 'Capital') capitales.push({ cuenta, monto: totalHaber - totalDebe });
    else if (tipo === 'Ingresos') totalIngresos += totalHaber - totalDebe;
    else if (tipo === 'Gastos') totalGastos += totalDebe - totalHaber;
  });

  const totalActivo = activos.reduce((s, a) => s + a.monto, 0);
  const totalPasivo = pasivos.reduce((s, p) => s + p.monto, 0);
  const totalCapitalPropio = capitales.reduce((s, c) => s + c.monto, 0);
  const utilidad = totalIngresos - totalGastos;
  const totalCapital = totalCapitalPropio + utilidad;
  const totalPasivoCapital = totalPasivo + totalCapital;
  const cuadra = Math.round((totalActivo - totalPasivoCapital) * 100) === 0;
  const utilidadDisplay = utilidad >= 0 ? money(utilidad) : `(${money(Math.abs(utilidad))})`;

  const filaVacia = (texto) => `<div class="ct-estado-row muted"><span>${texto}</span><span></span></div>`;

  return `
    <div class="ct-balance-general">
      <div class="ct-estado ct-bg-col">
        <div class="ct-estado-title">Activo</div>
        ${activos.length ? activos.map((a) => `<div class="ct-estado-row"><span>${esc(a.cuenta)}</span><span>${money(a.monto)}</span></div>`).join('') : filaVacia('Sin cuentas de activo')}
        <div class="ct-estado-row ct-estado-final"><span>Total Activo</span><span>${money(totalActivo)}</span></div>
      </div>
      <div class="ct-estado ct-bg-col">
        <div class="ct-estado-title">Pasivo</div>
        ${pasivos.length ? pasivos.map((p) => `<div class="ct-estado-row"><span>${esc(p.cuenta)}</span><span>${money(p.monto)}</span></div>`).join('') : filaVacia('Sin cuentas de pasivo')}
        <div class="ct-estado-row ct-estado-subtotal"><span>Total Pasivo</span><span>${money(totalPasivo)}</span></div>

        <div class="ct-estado-title" style="margin-top:16px;">Capital</div>
        ${capitales.map((c) => `<div class="ct-estado-row"><span>${esc(c.cuenta)}</span><span>${money(c.monto)}</span></div>`).join('')}
        <div class="ct-estado-row"><span>${utilidad >= 0 ? 'Utilidad del ejercicio' : 'Pérdida del ejercicio'}</span><span>${utilidadDisplay}</span></div>
        <div class="ct-estado-row ct-estado-subtotal"><span>Total Capital</span><span>${money(totalCapital)}</span></div>

        <div class="ct-estado-row ct-estado-final"><span>Total Pasivo + Capital</span><span>${money(totalPasivoCapital)}</span></div>
      </div>
    </div>
    <div class="ct-balanza-check ${cuadra ? 'ok' : 'off'}" style="max-width:1100px;margin:0 auto 24px;">
      ${cuadra ? '✓ El balance cuadra — Activo = Pasivo + Capital' : 'El balance no cuadra — revisa tus movimientos'}
    </div>
  `;
}

function render() {
  const hasData = state.movimientos.length > 0;
  const accounts = groupByCuenta(state.movimientos);
  const cuentasExistentes = [...new Set(state.movimientos.map((m) => m.cuenta))];
  const totalDebeGlobal = state.movimientos.reduce((s, m) => s + (m.debe || 0), 0);
  const totalHaberGlobal = state.movimientos.reduce((s, m) => s + (m.haber || 0), 0);
  const diffGlobal = totalDebeGlobal - totalHaberGlobal;
  const sumDebeForm = state.formLineas.reduce((s, l) => s + (parseFloat(l.debe) || 0), 0);
  const sumHaberForm = state.formLineas.reduce((s, l) => s + (parseFloat(l.haber) || 0), 0);
  const diffForm = sumDebeForm - sumHaberForm;

  const html = `
    <div class="ct-header">
      <div class="ct-title">
        <div class="ct-badge">T</div>
        <div class="ct-title-text">
          <span class="eyebrow">Práctica contable</span>
          <h1>Cuentas T</h1>
        </div>
      </div>
      <div class="ct-actions">
        <div class="ct-sample-combo">
          <span class="ct-sample-select-wrap">
            <select class="btn" data-field="sample-choice">
              ${SAMPLE_SCENARIOS.map((s, i) => `<option value="${i}" ${i === state.sampleIndex ? 'selected' : ''}>${esc(s.nombre)}</option>`).join('')}
            </select>
          </span>
          <button class="btn add" data-action="load-sample">Cargar ejemplo</button>
        </div>
        <button class="btn" data-action="trigger-upload">Subir archivo</button>
        ${hasData ? '<button class="btn add" data-action="export-excel">Descargar Excel</button>' : ''}
        ${hasData ? '<button class="btn" data-action="reset-all">Limpiar todo</button>' : ''}
        <input id="file-input" type="file" accept=".xlsx,.xls,.csv" style="display:none" />
      </div>
    </div>

    <div class="ct-guia-toggle">
      <button class="ct-help-link" data-action="toggle-guia">${state.showGuia ? '✕ Cerrar guía' : 'Guía rápida: ¿Debe o Haber?'}</button>
    </div>
    ${state.showGuia ? guiaHtml() : ''}

    <div class="ct-form">
      <span class="eyebrow">Nuevo movimiento</span>
      <div class="ct-form-top">
        <div class="field">
          <label>Fecha</label>
          <input type="text" placeholder="DD/MM" data-field="fecha" value="${esc(state.formFecha)}" />
        </div>
        <div class="field">
          <label>Concepto</label>
          <input type="text" placeholder="Descripción de la póliza" data-field="concepto" value="${esc(state.formConcepto)}" />
        </div>
      </div>
      <div class="ct-lineas">
        ${state.formLineas.map((l, i) => `
          <div class="ct-linea-row">
            <div class="field">
              <label>Cuenta</label>
              <input type="text" list="cuentas-existentes" placeholder="Ej. Caja" data-field="linea-cuenta" data-index="${i}" value="${esc(l.cuenta)}" />
            </div>
            <div class="field">
              <label>Debe</label>
              <input type="number" step="0.01" placeholder="0.00" data-field="linea-debe" data-index="${i}" value="${esc(l.debe)}" />
            </div>
            <div class="field">
              <label>Haber</label>
              <input type="number" step="0.01" placeholder="0.00" data-field="linea-haber" data-index="${i}" value="${esc(l.haber)}" />
            </div>
            ${state.formLineas.length > 1 ? `<button class="linea-remove" data-action="remove-linea" data-index="${i}" title="Quitar línea">✕</button>` : ''}
          </div>
        `).join('')}
        <datalist id="cuentas-existentes">
          ${cuentasExistentes.map((c) => `<option value="${esc(c)}"></option>`).join('')}
        </datalist>
      </div>
      <div class="ct-form-actions">
        <button class="btn" data-action="add-linea">+ Agregar línea</button>
        ${state.formLineas.length > 1 ? `<span id="form-diff" class="ct-linea-diff ${diffForm === 0 ? 'ok' : ''}">${diffForm === 0 ? '✓ Esta póliza cuadra' : `Diferencia: ${money(Math.abs(diffForm))} (falta en ${diffForm > 0 ? 'Haber' : 'Debe'})`}</span>` : ''}
        <button class="btn add" data-action="guardar-poliza" style="margin-left:auto">${state.formLineas.length > 1 ? 'Guardar póliza' : 'Agregar'}</button>
      </div>
      ${state.formError ? `<div class="form-error">${esc(state.formError)}</div>` : ''}
    </div>

    ${!hasData ? `
      <div class="ct-drop" id="dropzone" data-action="trigger-upload">
        <div class="ct-drop-icon">↑</div>
        <strong>Sube tu archivo de pólizas</strong>
        <p>Excel o CSV con columnas: Cuenta, Concepto, Debe, Haber — arrastra aquí o haz clic</p>
      </div>
    ` : ''}

    ${(state.fileName || hasData) ? `
      <div class="ct-filebar">
        <span>
          ${state.fileName ? `${esc(state.fileName)} · ` : ''}
          ${state.movimientos.length} movimiento${state.movimientos.length === 1 ? '' : 's'} capturado${state.movimientos.length === 1 ? '' : 's'}
        </span>
        ${hasData ? `<button class="ct-toggle-detalle" data-action="toggle-detalle">${state.showDetalle ? '▴ Ocultar detalle' : '▾ Ver detalle'}</button>` : ''}
      </div>
    ` : ''}

    ${hasData ? `
      <div class="ct-balance ${diffGlobal === 0 ? 'ok' : 'off'}">
        ${diffGlobal === 0
          ? `✓ Balanza cuadrada — Debe y Haber son iguales (${money(totalDebeGlobal)})`
          : `Descuadre de ${money(Math.abs(diffGlobal))} (${diffGlobal > 0 ? 'sobra en Debe' : 'sobra en Haber'})`}
      </div>
    ` : ''}

    ${state.showDetalle && hasData ? `
      <div class="ct-detalle">
        <table>
          <thead><tr><th>Fecha</th><th>Cuenta</th><th>Concepto</th><th>Debe</th><th>Haber</th><th></th></tr></thead>
          <tbody>
            ${state.movimientos.map((m, i) => `
              <tr>
                <td>${esc(m.fecha)}</td>
                <td>${esc(m.cuenta)}</td>
                <td>${esc(m.concepto)}</td>
                <td>${m.debe ? money(m.debe) : ''}</td>
                <td>${m.haber ? money(m.haber) : ''}</td>
                <td><button class="row-delete" data-action="remove-movimiento" data-index="${i}" title="Eliminar movimiento">✕</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    ` : ''}

    ${state.error ? `<div class="ct-error"><strong>Aviso:</strong> ${esc(state.error)}</div>` : ''}

    ${hasData && Object.keys(accounts).length > 0 ? `
      <div class="ct-tabs">
        <button class="ct-tab ${state.view === 'cuentas-t' ? 'active' : ''}" data-action="set-view" data-view="cuentas-t">Cuentas T</button>
        <button class="ct-tab ${state.view === 'balanza' ? 'active' : ''}" data-action="set-view" data-view="balanza">Balanza de comprobación</button>
        <button class="ct-tab ${state.view === 'estado-resultados' ? 'active' : ''}" data-action="set-view" data-view="estado-resultados">Estado de Resultados</button>
        <button class="ct-tab ${state.view === 'balance-general' ? 'active' : ''}" data-action="set-view" data-view="balance-general">Balance General</button>
      </div>

      ${state.view === 'cuentas-t' ? `
        <div class="ct-grid">
          ${Object.entries(accounts).map(([nombre, mov]) => accountTHtml(nombre, mov)).join('')}
        </div>
      ` : state.view === 'balanza' ? balanzaHtml(accounts) : (() => {
          const cuentasUsadas = [...new Set(state.movimientos.map((m) => m.cuenta))];
          const sinClasificar = cuentasUsadas.filter((c) => !getTipoCuenta(c));
          if (sinClasificar.length > 0) return clasificarHtml(sinClasificar);
          return state.view === 'estado-resultados' ? estadoResultadosHtml(accounts) : balanceGeneralHtml(accounts);
        })()}
    ` : ''}
  `;

  document.getElementById('app').innerHTML = `<div class="ct-root">${html}</div>`;
}

// ---------- Delegación de eventos ----------

document.addEventListener('DOMContentLoaded', () => {
  render();

  const app = document.getElementById('app');

  app.addEventListener('click', (e) => {
    const actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    const index = actionEl.dataset.index !== undefined ? parseInt(actionEl.dataset.index, 10) : null;

    if (action === 'load-sample') loadSample(state.sampleIndex);
    else if (action === 'trigger-upload') document.getElementById('file-input').click();
    else if (action === 'export-excel') exportExcel();
    else if (action === 'reset-all') resetAll();
    else if (action === 'add-linea') addLinea();
    else if (action === 'remove-linea') removeLinea(index);
    else if (action === 'guardar-poliza') guardarPoliza();
    else if (action === 'toggle-detalle') toggleDetalle();
    else if (action === 'remove-movimiento') removeMovimiento(index);
    else if (action === 'set-view') { state.view = actionEl.dataset.view; render(); }
    else if (action === 'toggle-guia') { state.showGuia = !state.showGuia; render(); }
    else if (action === 'guardar-clasificacion') guardarClasificacion();
  });

  app.addEventListener('input', (e) => {
    const field = e.target.dataset.field;
    if (!field) return;
    const index = e.target.dataset.index !== undefined ? parseInt(e.target.dataset.index, 10) : null;

    if (field === 'fecha') state.formFecha = e.target.value;
    else if (field === 'concepto') state.formConcepto = e.target.value;
    else if (field === 'linea-cuenta') state.formLineas[index].cuenta = e.target.value;
    else if (field === 'linea-debe') { state.formLineas[index].debe = e.target.value; updateFormDiff(); }
    else if (field === 'linea-haber') { state.formLineas[index].haber = e.target.value; updateFormDiff(); }
  });

  app.addEventListener('change', (e) => {
    if (e.target.id === 'file-input' && e.target.files[0]) {
      processFile(e.target.files[0]);
      e.target.value = '';
    } else if (e.target.dataset.field === 'sample-choice') {
      state.sampleIndex = parseInt(e.target.value, 10) || 0;
    } else if (e.target.dataset.field === 'clasificar') {
      state.pendingClasificacion[e.target.dataset.cuenta] = e.target.value;
    }
  });

  const dragOverlay = document.getElementById('ct-drag-overlay');
  let dragCounter = 0;
  const isFileDrag = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');

  window.addEventListener('dragenter', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    dragCounter++;
    dragOverlay.classList.add('show');
  });
  window.addEventListener('dragover', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
  });
  window.addEventListener('dragleave', () => {
    dragCounter--;
    if (dragCounter <= 0) {
      dragCounter = 0;
      dragOverlay.classList.remove('show');
    }
  });
  window.addEventListener('drop', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    dragCounter = 0;
    dragOverlay.classList.remove('show');
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) processFile(file);
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.error('SW error:', err));
    });
  }
});
</script>
</body>
</html>
